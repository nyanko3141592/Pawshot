name: Pawshot
options:
  bundleIdPrefix: com.pawshot
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  Pawshot:
    type: application
    platform: macOS
    sources:
      - path: Pawshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawshot.app
        INFOPLIST_FILE: Pawshot/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pawshot/Pawshot.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  PawshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PawshotTests
    dependencies:
      - target: Pawshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawshot.tests
